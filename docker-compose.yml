services:
  web:
    build: .
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clubinhopet
      MYSQL_USER: clubinho
      MYSQL_PASSWORD: clubinho
      MYSQL_CHARSET: utf8mb4
      LANG: C.UTF-8
    ports:
      - "3307:3306"
    volumes:
      - clubinho_mysql:/var/lib/mysql
      - ./database/docker/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clubinho_mysql:
