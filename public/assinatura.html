<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de Assinatura - Clubinho Pet Box">
    <title>Assinatura | Clubinho Pet Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img src="assets/images/logo/logo.png" alt="Clubinho Pet Box" class="logo" onerror="this.src='assets/images/logo/logo.jpg'">
            </a>
            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav" aria-label="Principal">
                <a href="index.html" class="nav-link">Início</a>
                <a href="planos.html" class="nav-link">Planos</a>
                <a href="sobre.html" class="nav-link">Sobre</a>
                <a href="contato.html" class="nav-link">Contato</a>
                <a href="planos.html" class="btn btn-primary">Assinar</a>
            </nav>
        </div>
    </header>

    <section class="page-hero">
        <div class="container reveal">
            <p class="text-uppercase text-gold">Assinatura</p>
            <h1>Complete seus dados</h1>
            <p class="lead">Preencha o formulário e siga para o checkout seguro.</p>
        </div>
    </section>

    <section class="section bg-white">
        <div class="container">
            <div class="form-panel reveal">
                <form id="subscription-form" method="POST" action="/subscribe" class="stack">
                    <div class="form-group">
                        <label for="plan">Plano</label>
                        <select id="plan" name="plan" required>
                            <option value="">Escolha um plano</option>
                            <option value="happy">Happy — R$ 101,47/mês</option>
                            <option value="love">Love — R$ 164,97/mês</option>
                            <option value="deluxe">Deluxe — R$ 253,87/mês</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">Nome completo</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <h3>Dados do pet</h3>
                    <div class="form-group">
                        <label for="pet_name">Nome do pet</label>
                        <input type="text" id="pet_name" name="pet_name" required>
                    </div>
                    <div class="form-group">
                        <label for="pet_type">Tipo</label>
                        <select id="pet_type" name="pet_type" required>
                            <option value="">Escolha</option>
                            <option value="cachorro">Cachorro</option>
                            <option value="gato">Gato</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pet_age">Idade (anos)</label>
                        <input type="number" id="pet_age" name="pet_age" min="0">
                    </div>
                    <div class="form-group">
                        <label for="pet_breed">Raça</label>
                        <input type="text" id="pet_breed" name="pet_breed">
                    </div>
                    <div class="form-group">
                        <label for="dietary_restrictions">Restrições alimentares</label>
                        <textarea id="dietary_restrictions" name="dietary_restrictions"></textarea>
                    </div>

                    <h3>Entrega</h3>
                    <div class="form-group">
                        <label for="address">Endereço</label>
                        <input type="text" id="address" name="address">
                    </div>

                    <div class="form-group cluster">
                        <input type="checkbox" id="terms" name="terms" required style="width:auto">
                        <label for="terms" style="margin:0;font-weight:400">Concordo com os termos da assinatura</label>
                    </div>

                    <div class="cluster">
                        <button type="submit" class="btn btn-primary">Continuar para pagamento</button>
                        <a href="planos.html" class="btn btn-secondary">Voltar aos planos</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Clubinho Pet Box.</p>
            </div>
        </div>
    </footer>
    <script src="assets/js/motion.js" defer></script>
</body>
</html>
